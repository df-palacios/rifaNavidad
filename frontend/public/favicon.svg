<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo redondeado en el rojo de la rifa -->
  <rect width="64" height="64" rx="14" fill="#b3121b"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>

  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#e0242c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8d0d14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe083"/>
      <stop offset="55%" stop-color="#f5c242"/>
      <stop offset="100%" stop-color="#d99a1f"/>
    </linearGradient>
  </defs>

  <!-- Caja de regalo -->
  <rect x="13" y="27" width="38" height="24" rx="3" fill="#f7f2e8"/>
  <rect x="11" y="22" width="42" height="9" rx="3" fill="#fffaf0"/>

  <!-- Cinta vertical -->
  <rect x="28.5" y="22" width="7" height="29" fill="url(#gold)"/>

  <!-- Lazo -->
  <path d="M32 22c-4.5 0-9-2.2-9-6.2 0-2.6 2-4.3 4.3-4.3 3.4 0 5.4 3.6 4.7 10.5z"
        fill="url(#gold)"/>
  <path d="M32 22c4.5 0 9-2.2 9-6.2 0-2.6-2-4.3-4.3-4.3-3.4 0-5.4 3.6-4.7 10.5z"
        fill="url(#gold)"/>
  <circle cx="32" cy="20.5" r="3.1" fill="#ffe9a8"/>
</svg>
